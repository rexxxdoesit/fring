<title>Fring embed demo</title>


<link rel="stylesheet" href="https://fring.rexxxdoesit.com/ring.css">

<style>
html{
  font-family: sans-serif;
  text-align: center;
  background-color: #d9d;
}
body{
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* Black Embed variant style */
.black {
  --ring-bg: #000;
  --ring-border: #fff 1px solid;
}

/* Custom Embed variant style example (includes custom hover animation) */
.custom {
  --ring-bg: #407;
  --ring-border: none;
  --ring-height: 40px;
  --ring-pad: 24px;
}
.custom a {
  transition: scale .15s;
  
}
.custom a:hover,
.custom a:focus-visible {
  scale: 1.1;
  opacity: 1;
}
</style>
